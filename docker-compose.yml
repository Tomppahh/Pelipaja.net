services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - '3000:3000'
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - MONGODB_URI=mongodb://mongodb:27017/pelipaja
    depends_on:
      - mongodb
  mongodb:
    image: mongo:7
    volumes:
      - mongo-data:/data/db
volumes:
  mongo-data: